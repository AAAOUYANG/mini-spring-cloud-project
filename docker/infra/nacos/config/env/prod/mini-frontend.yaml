# ============================================================================
# 前端（mini-vue3-project）在 prod 命名空间里的配置 —— 结构与 dev 那份完全一致，
# 只有值不同。同一时刻只会有一个前端容器在读其中一份，由 NACOS_NAMESPACE 决定。
#
# 说明为什么这里和 dev 看起来"一样"：本机模拟环境里，prod 的后端也是同一套容器
# （同一个 mini-net 里的 mini-gateway），所以地址确实相同。**环境差异不体现在这一行，
# 而在 Nacos 命名空间**：prod 的网关只看得见注册在 prod 命名空间里的实例。
# 真实生产里这一个 key 会写成生产的入口域名或内网 LB。
# ============================================================================
frontend:
  env-label: prod
  backend-origin: http://mini-gateway:9000
  # 生产给更长的反代超时：真实链路更长，且不希望偶发慢请求被直接切断
  proxy-timeout: 60